<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16070a"/><stop offset=".55" stop-color="#0b0b0e"/><stop offset="1" stop-color="#050506"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".28"/><stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/></radialGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#c40000"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></linearGradient>
<filter id="neon" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5" result="a"/><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff1e1e" stroke-opacity=".08"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern>
<clipPath id="frame"><rect width="640" height="360" rx="18"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="640" height="360" fill="url(#bg)"/>
<rect width="640" height="360" fill="url(#grid)"/>
<rect width="640" height="360" fill="url(#glow)"/>

<rect x="200" y="22" width="240" height="300" rx="16" fill="#18181d"/>
<circle cx="320" cy="140" r="46" fill="#2a2a31"/><path d="M226 322c0-70 42-112 94-112s94 42 94 112z" fill="#2a2a31"/>
<circle cx="222" cy="44" r="6" fill="#ff1e1e"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><text x="234" y="48" font-size="11" fill="#f4f4f6" font-weight="800" text-anchor="start" >REC</text>
<rect x="214" y="232" width="212" height="58" rx="8" fill="#000" opacity=".55"/>
<text x="320" y="256" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">JE CRÉE TON <tspan fill="#000" style="paint-order:stroke" stroke="#ffd23f" stroke-width="18">SITE</tspan></text>
<text x="320" y="280" font-size="17" fill="#fff" font-weight="900" text-anchor="middle" >EN 10 JOURS</text><rect x="0" y="262" width="640" height="98" fill="url(#fade)"/>
<rect x="16" y="16" width="86" height="24" rx="12" fill="#000" fill-opacity=".55" stroke="#ff1e1e" stroke-opacity=".6"/>
<text x="59" y="33" font-size="11" fill="#ff4d4d" font-weight="800" text-anchor="middle" letter-spacing="1.5">PROMPT 19</text>
<rect x="528" y="16" width="96" height="24" rx="12" fill="#000" fill-opacity=".55" stroke="#26262c"/>
<text x="576" y="33" font-size="11" fill="#9a9aa4" font-weight="600" text-anchor="middle" >9:16 · 30 s</text>
<text x="20" y="316" font-size="20" fill="#f4f4f6" font-weight="700" text-anchor="start" >Face caméra sous-titré</text>
<path d="M22 334l9 5.5-9 5.5z" fill="#f4f4f6"/>
<rect x="42" y="337" width="576" height="4" rx="2" fill="#fff" fill-opacity=".18"/>
<rect x="42" y="337" width="443" height="4" rx="2" fill="#ff1e1e"/>
<circle cx="485" cy="339" r="6" fill="#fff"/>
<rect width="640" height="360" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="639" height="359" rx="18" fill="none" stroke="#ff1e1e" stroke-opacity=".35"/>
</svg>
