<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="red"><stop offset="0" stop-color="#e10600"/></linearGradient>
<linearGradient id="fade"><stop offset="0" stop-color="#111111"/></linearGradient>
<filter id="neon"><feOffset dx="0" dy="0"/></filter>
<filter id="soft"><feOffset dx="0" dy="0"/></filter>
<clipPath id="frame"><rect width="1200" height="520" rx="4"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="520" fill="#111111"/>
<text x="40" y="56" font-size="15" fill="#e10600" font-weight="700" text-anchor="start" letter-spacing="5">CE QUE JE CONSTRUIS</text>
<rect x="300" y="50" width="860" height="1" fill="#2c2c2c"/>
<g filter="url(#soft)"><rect x="40" y="90" width="550" height="190" rx="16" fill="#1a1a1a" stroke="#2c2c2c"/></g>
<rect x="40" y="90" width="4" height="190" rx="2" fill="url(#red)"/>
<circle cx="110" cy="160" r="40" fill="#e10600" fill-opacity=".08" stroke="#e10600" stroke-opacity=".3"/>
<g transform="translate(110,160)" fill="none" stroke="#e10600" stroke-width="2.4"><circle r="22"/><ellipse rx="9" ry="22"/><path d="M-22 0H22M-19 -11H19M-19 11H19"/></g>
<text x="560" y="138" font-size="40" fill="#2a2a31" font-weight="800" text-anchor="end" >01</text>
<text x="170" y="152" font-size="27" fill="#f2f0eb" font-weight="700" text-anchor="start" >Sites web</text>
<text x="170" y="190" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >Vitrines, portfolios, boutiques.</text>
<text x="170" y="216" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >Rapides, propres, faits pour convertir.</text>
<rect x="170" y="238" width="60" height="3" rx="1.5" fill="#e10600"/><g filter="url(#soft)"><rect x="610" y="90" width="550" height="190" rx="16" fill="#1a1a1a" stroke="#2c2c2c"/></g>
<rect x="610" y="90" width="4" height="190" rx="2" fill="url(#red)"/>
<circle cx="680" cy="160" r="40" fill="#e10600" fill-opacity=".08" stroke="#e10600" stroke-opacity=".3"/>
<g transform="translate(680,160)" fill="none" stroke="#e10600" stroke-width="2.4"><rect x="-14" y="-24" width="28" height="48" rx="6"/><path d="M-5 -18H5"/><circle cy="17" r="2.5" fill="#e10600"/></g>
<text x="1130" y="138" font-size="40" fill="#2a2a31" font-weight="800" text-anchor="end" >02</text>
<text x="740" y="152" font-size="27" fill="#f2f0eb" font-weight="700" text-anchor="start" >Applications mobiles</text>
<text x="740" y="190" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >iOS et Android, prêtes pour</text>
<text x="740" y="216" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >l'App Store et le Play Store.</text>
<rect x="740" y="238" width="60" height="3" rx="1.5" fill="#e10600"/><g filter="url(#soft)"><rect x="40" y="300" width="550" height="190" rx="16" fill="#1a1a1a" stroke="#2c2c2c"/></g>
<rect x="40" y="300" width="4" height="190" rx="2" fill="url(#red)"/>
<circle cx="110" cy="370" r="40" fill="#e10600" fill-opacity=".08" stroke="#e10600" stroke-opacity=".3"/>
<g transform="translate(110,370)" fill="none" stroke="#e10600" stroke-width="2.4"><rect x="-20" y="-12" width="40" height="30" rx="9"/><path d="M0 -12V-22"/><circle cy="-24" r="3" fill="#e10600"/><circle cx="-8" cy="2" r="3.5" fill="#e10600"/><circle cx="8" cy="2" r="3.5" fill="#e10600"/><path d="M-26 0V8M26 0V8"/></g>
<text x="560" y="348" font-size="40" fill="#2a2a31" font-weight="800" text-anchor="end" >03</text>
<text x="170" y="362" font-size="27" fill="#f2f0eb" font-weight="700" text-anchor="start" >Bots &amp; automatisation</text>
<text x="170" y="400" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >Discord, Telegram, WhatsApp.</text>
<text x="170" y="426" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >Pensés pour ta communauté.</text>
<rect x="170" y="448" width="60" height="3" rx="1.5" fill="#e10600"/><g filter="url(#soft)"><rect x="610" y="300" width="550" height="190" rx="16" fill="#1a1a1a" stroke="#2c2c2c"/></g>
<rect x="610" y="300" width="4" height="190" rx="2" fill="url(#red)"/>
<circle cx="680" cy="370" r="40" fill="#e10600" fill-opacity=".08" stroke="#e10600" stroke-opacity=".3"/>
<g transform="translate(680,370)" fill="none" stroke="#e10600" stroke-width="2.4"><path d="M0 -24L20 -16V0C20 13 11 21 0 25C-11 21 -20 13 -20 0V-16Z"/><path d="M-8 1L-2 7L9 -6"/></g>
<text x="1130" y="348" font-size="40" fill="#2a2a31" font-weight="800" text-anchor="end" >04</text>
<text x="740" y="362" font-size="27" fill="#f2f0eb" font-weight="700" text-anchor="start" >Cybersécurité</text>
<text x="740" y="400" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >Audits, accès protégés,</text>
<text x="740" y="426" font-size="18" fill="#8c8a85" font-weight="400" text-anchor="start" >bonnes pratiques dès le départ.</text>
<rect x="740" y="448" width="60" height="3" rx="1.5" fill="#e10600"/>
</g>
</svg>
