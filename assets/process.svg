<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16070a"/><stop offset=".55" stop-color="#0b0b0e"/><stop offset="1" stop-color="#050506"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".28"/><stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/></radialGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#c40000"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></linearGradient>
<filter id="neon" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5" result="a"/><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff1e1e" stroke-opacity=".08"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern>
<clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="280" fill="url(#bg)"/>
<rect width="1200" height="280" fill="url(#grid)"/>
<rect width="1200" height="280" fill="url(#glow)"/>
<text x="40" y="52" font-size="15" fill="#ff4d4d" font-weight="700" text-anchor="start" letter-spacing="5">COMMENT ON BOSSE</text>
<rect x="270" y="46" width="890" height="1" fill="#26262c"/>
<line x1="200" y1="130" x2="1000" y2="130" stroke="#26262c" stroke-width="3"/>
<line x1="200" y1="130" x2="1000" y2="130" stroke="#ff1e1e" stroke-width="3" stroke-dasharray="14 10"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.2s" repeatCount="indefinite"/></line><circle cx="200" cy="130" r="38" fill="#121216" stroke="#ff1e1e" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="200" cy="130" r="48" fill="none" stroke="#ff1e1e" stroke-opacity=".25"/>
<text x="200" y="141" font-size="28" fill="#ff4d4d" font-weight="800" text-anchor="middle" >01</text>
<text x="200" y="210" font-size="26" fill="#f4f4f6" font-weight="700" text-anchor="middle" >On discute</text>
<text x="200" y="242" font-size="17" fill="#9a9aa4" font-weight="400" text-anchor="middle" >Ton idée, tes objectifs, ton budget.</text><circle cx="600" cy="130" r="38" fill="#121216" stroke="#ff1e1e" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="600" cy="130" r="48" fill="none" stroke="#ff1e1e" stroke-opacity=".25"/>
<text x="600" y="141" font-size="28" fill="#ff4d4d" font-weight="800" text-anchor="middle" >02</text>
<text x="600" y="210" font-size="26" fill="#f4f4f6" font-weight="700" text-anchor="middle" >Je construis</text>
<text x="600" y="242" font-size="17" fill="#9a9aa4" font-weight="400" text-anchor="middle" >Design, dev et tests, avec toi.</text><circle cx="1000" cy="130" r="38" fill="#121216" stroke="#ff1e1e" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="1000" cy="130" r="48" fill="none" stroke="#ff1e1e" stroke-opacity=".25"/>
<text x="1000" y="141" font-size="28" fill="#ff4d4d" font-weight="800" text-anchor="middle" >03</text>
<text x="1000" y="210" font-size="26" fill="#f4f4f6" font-weight="700" text-anchor="middle" >Je t'accompagne</text>
<text x="1000" y="242" font-size="17" fill="#9a9aa4" font-weight="400" text-anchor="middle" >Mise en ligne, puis suivi après livraison.</text>
<rect width="1200" height="280" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="279" rx="18" fill="none" stroke="#ff1e1e" stroke-opacity=".35"/>
</svg>
