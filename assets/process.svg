<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="red"><stop offset="0" stop-color="#e10600"/></linearGradient>
<linearGradient id="fade"><stop offset="0" stop-color="#111111"/></linearGradient>
<filter id="neon"><feOffset dx="0" dy="0"/></filter>
<filter id="soft"><feOffset dx="0" dy="0"/></filter>
<clipPath id="frame"><rect width="1200" height="280" rx="4"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="280" fill="#111111"/>
<text x="40" y="52" font-size="15" fill="#e10600" font-weight="700" text-anchor="start" letter-spacing="5">COMMENT ON BOSSE</text>
<rect x="270" y="46" width="890" height="1" fill="#2c2c2c"/>
<line x1="200" y1="130" x2="1000" y2="130" stroke="#2c2c2c" stroke-width="3"/>
<line x1="200" y1="130" x2="1000" y2="130" stroke="#e10600" stroke-width="3" stroke-dasharray="14 10"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.2s" repeatCount="indefinite"/></line><circle cx="200" cy="130" r="38" fill="#1a1a1a" stroke="#e10600" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="200" cy="130" r="48" fill="none" stroke="#e10600" stroke-opacity=".25"/>
<text x="200" y="141" font-size="28" fill="#e10600" font-weight="800" text-anchor="middle" >01</text>
<text x="200" y="210" font-size="26" fill="#f2f0eb" font-weight="700" text-anchor="middle" >On discute</text>
<text x="200" y="242" font-size="17" fill="#8c8a85" font-weight="400" text-anchor="middle" >Ton idée, tes objectifs, ton budget.</text><circle cx="600" cy="130" r="38" fill="#1a1a1a" stroke="#e10600" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="600" cy="130" r="48" fill="none" stroke="#e10600" stroke-opacity=".25"/>
<text x="600" y="141" font-size="28" fill="#e10600" font-weight="800" text-anchor="middle" >02</text>
<text x="600" y="210" font-size="26" fill="#f2f0eb" font-weight="700" text-anchor="middle" >Je construis</text>
<text x="600" y="242" font-size="17" fill="#8c8a85" font-weight="400" text-anchor="middle" >Design, dev et tests, avec toi.</text><circle cx="1000" cy="130" r="38" fill="#1a1a1a" stroke="#e10600" stroke-width="2.5" filter="url(#soft)"/>
<circle cx="1000" cy="130" r="48" fill="none" stroke="#e10600" stroke-opacity=".25"/>
<text x="1000" y="141" font-size="28" fill="#e10600" font-weight="800" text-anchor="middle" >03</text>
<text x="1000" y="210" font-size="26" fill="#f2f0eb" font-weight="700" text-anchor="middle" >Je t'accompagne</text>
<text x="1000" y="242" font-size="17" fill="#8c8a85" font-weight="400" text-anchor="middle" >Mise en ligne, puis suivi après livraison.</text>
</g>
</svg>
